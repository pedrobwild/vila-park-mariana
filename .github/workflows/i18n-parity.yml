name: i18n parity (investor)

on:
  pull_request:
    paths:
      - "src/i18n/locales/pt.json"
      - "src/i18n/locales/en.json"
      - "scripts/i18n-parity-report.ts"
      - ".github/workflows/i18n-parity.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run i18n parity report
        id: report
        run: npm run i18n:report
        continue-on-error: true

      - name: Append job summary
        if: always()
        run: |
          if [ -f i18n-parity-report.md ]; then
            cat i18n-parity-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-parity-report
          path: i18n-parity-report.md
          if-no-files-found: ignore

      - name: Comment on PR
        if: always() && github.event.pull_request.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'i18n-parity-report.md';
            if (!fs.existsSync(path)) {
              core.info('No parity report file to post.');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            const marker = '<!-- i18n-parity-report -->';
            const finalBody = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: finalBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: finalBody,
              });
            }

      - name: Enforce strict parity
        run: npm run i18n:check
